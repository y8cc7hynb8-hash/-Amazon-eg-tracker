
name: Run Egypt Deals Radar V14

on:
  workflow_dispatch:
    schedule:
    - cron: '*/30 * * * *'
permissions:
  contents: write

concurrency:
  group: egypt-deals-radar
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install libraries
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 curl_cffi cloudscraper

      - name: Run V14 tracker
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          MARKET_SEARCH_ENABLED: '1'
          MARKET_SEARCH_MAX_PRODUCTS: '18'
          MARKET_SEARCH_RESULTS: '10'
          MARKET_FETCH_PER_PRODUCT: '6'
          MARKET_MIN_OTHER_STORES: '2'
          MARKET_MIN_GAP_PCT: '3'
        run: python -u tracker.py

